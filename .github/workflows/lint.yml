name: Lint

on:
   push:
      branches:
         - main
         - develop
   pull_request:
      branches:
         - main
         - develop

permissions:
   contents: read

concurrency:
   group: lint-${{ github.ref }}
   cancel-in-progress: true

jobs:
   lint:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: ${{ vars.BUN_VERSION }}

         - name: Install dependencies
           run: bun install --frozen-lockfile && bun run transpile-esm

         - name: Run Lint
           run: bun run lint
